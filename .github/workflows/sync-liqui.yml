name: AOG Liquipedia Auto Sync

on:
  schedule:
    # Tự động cào dữ liệu mỗi 30 phút
    - cron: '*/30 * * * *'
  workflow_dispatch: # Cho phép bấm nút chạy thử bằng tay

permissions:
  contents: write # Cấp quyền ghi file standings.json vào repo

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: setup/node@v4
        with:
          node-version: 18

      - name: Scrape Liquipedia AOG Winter 2026
        run: |
          node -e '
          const https = require("https");
          const fs = require("fs");

          const url = "https://liquipedia.net/honorofkings/Arena_of_Glory/2026/Winter/Group_Stage";
          const options = {
            headers: {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36",
              "Accept-Encoding": "gzip, deflate, br"
            }
          };

          https.get(url, options, (res) => {
            let zlib = require("zlib");
            let stream = res;
            if (res.headers["content-encoding"] === "gzip") stream = res.pipe(zlib.createGunzip());
            else if (res.headers["content-encoding"] === "br") stream = res.pipe(zlib.createBrotliDecompress());

            let data = "";
            stream.on("data", chunk => data += chunk);
            stream.on("end", () => {
              const list = [];
              const regex = /data-toggle-area-content="1"[^>]*>[\s\S]*?<span class="team-template-text"><a[^>]*>([^<]+)<\/a><\/span>[\s\S]*?<b>(\d+)<\/b>\s*[-–]\s*<b>(\d+)<\/b>[\s\S]*?<b>([+-]?\d+)<\/b>/g;
              let match;
              let r = 1;
              const map = {
                "Saigon Phantom": "SGP", "One Star Esports": "1S", "Team Flash": "FL",
                "FPT x Flash": "FPT", "FPT Polytechnic": "FPL", "BOX Gaming": "BOX", "Box Gaming": "BOX",
                "GAM Esports": "GAM", "Team Secret": "TS", "Big Man Esports": "BME",
                "Rex Regum Qeon": "RRQ", "Rex Regum Qeon VN": "RRQ", "BOOM Esports VN": "BME"
              };

              while ((match = regex.exec(data)) !== null && r <= 10) {
                const tag = map[match[1].trim()] || match[1].trim().toUpperCase();
                const wins = parseInt(match[2], 10);
                const losses = parseInt(match[3], 10);
                list.push({
                  rank: r++,
                  tag: tag,
                  wins: wins,
                  losses: losses,
                  played: wins + losses,
                  diff: parseInt(match[4], 10),
                  points: wins,
                  bounty: wins * 30 + 10
                });
              }

              const result = {
                status: "SUCCESS",
                updatedAt: new Date().toISOString(),
                source: "Liquipedia via GitHub Actions",
                standings: list
              };

              fs.writeFileSync("standings.json", JSON.stringify(result, null, 2));
              console.log("Đã cập nhật standings.json thành công với " + list.length + " đội.");
            });
          }).on("error", (e) => {
            console.error("Lỗi cào dữ liệu: ", e);
          });
          '

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add standings.json
          git commit -m "Auto-update AOG standings from Liquipedia" || exit 0
          git push
